<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Question For You 💖</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Dancing+Script:wght@700&family=DM+Sans&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #1a0510;
        font-family: "DM Sans", sans-serif;
        color: #fff;
        text-align: center;
      }

      .top-nav {
        display: flex;
        justify-content: center;
        gap: 2rem;
        padding: 1rem;
        background: #15070f;
      }

      .top-nav a {
        color: #e8a0b8;
        text-decoration: none;
      }

      .page-wrap {
        height: 90vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .question-text {
        font-family: "Dancing Script", cursive;
        font-size: 2.5rem;
        margin-bottom: 1rem;
        color: #f0a0c0;
      }

      .emotion-msg {
        font-style: italic;
        margin-bottom: 2rem;
        color: #d8a0b5;
      }

      .btn-wrap {
        display: flex;
        gap: 20px;
      }

      .btn-yes {
        background: #e91e8c;
        color: #fff;
        border: none;
        padding: 14px 35px;
        border-radius: 40px;
        font-size: 1.3rem;
        cursor: pointer;
      }

      .btn-no {
        background: transparent;
        border: 1px solid pink;
        color: #d080a0;
        padding: 12px 30px;
        border-radius: 40px;
        font-size: 1.2rem;
        cursor: pointer;
        position: relative;
        transition: all 0.3s ease;
      }

      .celebration {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 999;
      }

      .celebration.show {
        display: flex;
      }

      .celebration-text {
        font-size: 3rem;
        color: #ff69b4;
      }
    </style>
  </head>

  <body>
    <nav class="top-nav">
      <a href="#">Home</a>
      <a href="#">Message</a>
      <a href="#">Music</a>
      <a href="#">Surprise</a>
    </nav>

    <div class="celebration" id="celebration">
      <div class="celebration-text">She said YES 💖</div>
    </div>

    <div class="page-wrap">
      <div class="question-text">Will you be my Girlfriend? 🥺</div>
      <div class="emotion-msg" id="emotionMsg">
        ( I've been waiting to ask you this… )
      </div>

      <div class="btn-wrap">
        <button class="btn-yes" onclick="pressedYes()">Yes 💖</button>
        <button class="btn-no" id="btnNo" onclick="pressedNo(event)">No</button>
      </div>
    </div>

    <script>
      let noCount = 0;
      let isFloating = false;

      const btnNo = document.getElementById("btnNo");
      const emotionMsg = document.getElementById("emotionMsg");

      const messages = [
        "Are you sure? 🥺",
        "That hurt 💔",
        "Please think again 🙏",
        "I’ll wait... 😢",
        "You can’t escape 😏",
        "Still no? 😭",
        "Okay now I’m serious 😤",
        "Last chance 😶",
        "Fine... it’s gone 😢",
      ];

      function pressedNo(e) {
        noCount++;

        emotionMsg.textContent =
          messages[Math.min(noCount - 1, messages.length - 1)];

        // First click → make floating
        if (!isFloating) {
          const rect = btnNo.getBoundingClientRect();
          btnNo.style.position = "fixed";
          btnNo.style.left = rect.left + "px";
          btnNo.style.top = rect.top + "px";
          isFloating = true;
        }

        // Shrink + fade
        

        if (noCount >= 9) {
          btnNo.style.display = "none";
          emotionMsg.textContent = "Only YES is left now 💖";
          return;
        }

        jumpAway(e.clientX, e.clientY);
      }

      function jumpAway(x, y) {
        const vw = window.innerWidth;
        const vh = window.innerHeight;

        let nx, ny;

        do {
          nx = Math.random() * (vw - 100);
          ny = Math.random() * (vh - 50);
        } while (Math.abs(nx - x) < 120 && Math.abs(ny - y) < 80);

        btnNo.style.left = nx + "px";
        btnNo.style.top = ny + "px";
      }

      function pressedYes() {
        document.getElementById("celebration").classList.add("show");
      }
    </script>
  </body>
</html>
