<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Question For You 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Dancing+Script:wght@600;700&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
      display: block;
      background: #1a0510;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(180,40,80,0.18) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(120,20,60,0.15) 0%, transparent 55%),
        radial-gradient(ellipse at 60% 80%, rgba(80,10,40,0.2) 0%, transparent 50%),
        linear-gradient(160deg, #1f0a18 0%, #120408 50%, #1a0a0e 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* NAV */
    .top-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      padding: 1.1rem 2rem;
      background: rgba(15,5,10,0.85);
      border-bottom: 1px solid rgba(200,80,120,0.2);
      position: sticky;
      top: 0; left: 0;
      width: 100%;
      z-index: 200;
      backdrop-filter: blur(10px);
    }
    .top-nav a {
      font-size: 13px;
      color: #e8a0b8;
      text-decoration: none;
      letter-spacing: 0.08em;
      transition: color 0.2s, text-shadow 0.2s;
    }
    .top-nav a:hover { color: #ffd6e7; text-shadow: 0 0 12px rgba(255,150,180,0.6); }

    /* PAGE */
    .page-wrap {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 52px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem 4rem;
      gap: 0;
    }

    /* PHOTO */
    .photo-frame {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 3px solid rgba(220,100,150,0.5);
      box-shadow:
        0 0 0 6px rgba(180,50,100,0.15),
        0 0 40px rgba(200,60,110,0.3),
        0 10px 40px rgba(0,0,0,0.5);
      overflow: hidden;
      margin-bottom: 2.2rem;
      animation: fadeIn 1s ease 0.2s both;
      background: rgba(40,10,25,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: rgba(220,140,170,0.5);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .photo-placeholder span { font-size: 2.5rem; }

    /* QUESTION */
    .question-text {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2rem, 7vw, 3.2rem);
      font-weight: 700;
      color: #f0a0c0;
      text-align: center;
      line-height: 1.25;
      margin-bottom: 0.6rem;
      animation: riseUp 1s cubic-bezier(0.22,1,0.36,1) 0.4s both;
      text-shadow: 0 0 30px rgba(220,80,130,0.5), 0 4px 20px rgba(0,0,0,0.4);
    }

    .emotion-msg {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: rgba(230,160,190,0.85);
      text-align: center;
      min-height: 1.8rem;
      margin-bottom: 2rem;
      transition: all 0.3s ease;
      animation: riseUp 1s ease 0.6s both;
    }

    /* BUTTONS */
    .btn-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      position: relative;
      min-height: 70px;
      width: 100%;
      max-width: 420px;
      animation: riseUp 1s ease 0.8s both;
    }

    .btn-yes {
      font-family: 'Dancing Script', cursive;
      font-size: 1.4rem;
      font-weight: 700;
      padding: 14px 40px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, #e91e8c, #c2185b);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(233,30,140,0.45);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      z-index: 2;
    }
    .btn-yes:hover {
      transform: scale(1.08);
      box-shadow: 0 10px 32px rgba(233,30,140,0.6);
    }

    .btn-no {
      font-family: 'Dancing Script', cursive;
      font-size: 1.3rem;
      font-weight: 600;
      padding: 12px 30px;
      border-radius: 50px;
      border: 1.5px solid rgba(220,100,150,0.4);
      background: rgba(30,10,20,0.6);
      color: #d080a0;
      cursor: pointer;
      position: fixed;
      z-index: 150;
      white-space: nowrap;
      transition: left 0.18s cubic-bezier(0.22,1,0.36,1),
                  top  0.18s cubic-bezier(0.22,1,0.36,1),
                  font-size 0.3s, opacity 0.3s, padding 0.3s;
    }

    .celebration.show { display: flex; }

    .celebration-text {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.4rem, 9vw, 5rem);
      font-weight: 700;
      color: #f9a8c9;
      text-align: center;
      line-height: 1.2;
      text-shadow: 0 0 40px rgba(240,80,140,0.7), 0 0 80px rgba(200,40,100,0.4);
      animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
      padding: 0 1.5rem;
    }
    .celebration-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.3rem;
      color: rgba(240,180,210,0.8);
      margin-top: 1rem;
      text-align: center;
      animation: fadeIn 0.8s ease 0.5s both;
    }
    .celebration-emoji {
      font-size: 3rem;
      margin-top: 1.5rem;
      animation: bounce 0.6s ease 0.6s both;
    }

    /* FALLING HEARTS */
    .falling-items {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .fall-item {
      position: absolute;
      top: -40px;
      opacity: 0;
      animation: fallDown linear infinite;
    }
    @keyframes fallDown {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0.85; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    /* CONFETTI burst on yes */
    .confetti-piece {
      position: fixed;
      width: 10px; height: 10px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 600;
      animation: confettiFall 1.4s ease forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translate(var(--cx), var(--cy)) rotate(720deg) scale(0.3); opacity: 0; }
    }

    @keyframes riseUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes bounce {
      0%   { transform: scale(0); opacity: 0; }
      60%  { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px) rotate(-3deg); }
      75%      { transform: translateX(6px) rotate(3deg); }
    }

    @media (max-width: 480px) {
      .photo-frame { width: 160px; height: 160px; }
      .top-nav { gap: 1.2rem; }
      .top-nav a { font-size: 12px; }
    }
  </style>
</head>
<body>

  <div class="falling-items" id="fallingContainer"></div>

  <nav class="top-nav">
    <a href="surprise.html">💖 Surprise</a>
    <a href="messages.html">💌 Message</a>
    <a href="music.html">🎵 Music</a>
    <a href="gift.html">🌸 Gifts</a>
  </nav>

  <!-- CELEBRATION SCREEN -->
  <div class="celebration" id="celebration">
    <div class="celebration-text">She said YES! 💖<br>You're mine now 🥹</div>
    <div class="celebration-sub">I knew you would… my heart knew it all along.</div>
    <div class="celebration-emoji">🌹💕✨🥰🌸</div>
  </div>

  <div class="page-wrap">

    <!-- PHOTO -->
    <div class="photo-frame" id="photoFrame">
      <!-- Replace src below with your actual photo path e.g. src="viji.jpg" -->
      <!-- <img src="your-photo.jpg" alt="Our Photo"> -->
      <div class="photo-placeholder">
        <span>🌸</span>
        <p>your photo here</p>
      </div>
    </div>

    <div class="question-text" id="questionText">Will you be my Girlfriend? 🥺</div>
    <div class="emotion-msg" id="emotionMsg">( I've been waiting to ask you this… )</div>

    <div class="btn-wrap" id="btnWrap">
      <button class="btn-yes" id="btnYes" onclick="pressedYes()">Yes 💖</button>
      <button class="btn-no"  id="btnNo"  onclick="pressedNo()">No</button>
    </div>

  </div>

  <script>
    // Falling petals
    const symbols = ['🌸','💕','🌹','✨','💖','🌷','⭐','💗'];
    const fc = document.getElementById('fallingContainer');
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('span');
      el.className = 'fall-item';
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (0.6 + Math.random() * 0.9) + 'rem';
      el.style.animationDuration = (7 + Math.random() * 10) + 's';
      el.style.animationDelay = (Math.random() * 14) + 's';
      fc.appendChild(el);
    }

    const noMessages = [
      "( Are you sure?? 🥺 )",
      "( My heart just cracked a little… 💔 )",
      "( Please… I'm begging you 🙏 )",
      "( That really hurt… 😢 )",
      "( Okay fine… just kidding press YES 😭 )",
      "( The No button is running away from you… )",
      "( Even the flowers are sad now 🌷 )",
      "( I wrote this whole page for you… 🥹 )",
      "( The No button officially quit 😤 )",
    ];

    let noCount = 0;
    const btnNo     = document.getElementById('btnNo');
    const emotionMsg = document.getElementById('emotionMsg');

    // Position No button initially near the Yes button
    function initNoBtn() {
      const yes = document.getElementById('btnYes').getBoundingClientRect();
      btnNo.style.left = (yes.right + 20) + 'px';
      btnNo.style.top  = yes.top + 'px';
    }
    window.addEventListener('load', initNoBtn);

    // Jump to a safe random spot away from current cursor/touch position
    function jumpAway(avoidX, avoidY) {
      noCount++;

      const msg = noMessages[Math.min(noCount - 1, noMessages.length - 1)];
      emotionMsg.textContent = msg;
      emotionMsg.style.animation = 'none';
      void emotionMsg.offsetWidth;
      emotionMsg.style.animation = 'riseUp 0.4s ease';

      // Shrink progressively
      const sizes = [1.25, 1.1, 1.0, 0.9, 0.8, 0.7, 0.58, 0.45, 0.32];
      const s = sizes[Math.min(noCount - 1, sizes.length - 1)];
      btnNo.style.fontSize = s + 'rem';
      btnNo.style.padding  = (12 * s) + 'px ' + (28 * s) + 'px';
      btnNo.style.opacity  = Math.max(0.2, 1 - noCount * 0.09);

      if (noCount >= 9) {
        btnNo.style.opacity = '0';
        btnNo.style.pointerEvents = 'none';
        emotionMsg.textContent = "( No button ran away forever. Only YES is left 💖 )";
        return;
      }

      // Pick a random position far from avoidX/avoidY
      const margin = 16;
      const bw = btnNo.offsetWidth  || 80;
      const bh = btnNo.offsetHeight || 44;
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      let rx, ry, attempts = 0;
      do {
        rx = margin + Math.random() * (vw - bw - margin * 2);
        ry = margin + Math.random() * (vh - bh - margin * 2);
        attempts++;
      } while (
        attempts < 20 &&
        Math.abs(rx - avoidX) < 120 &&
        Math.abs(ry - avoidY) < 80
      );

      btnNo.style.left = rx + 'px';
      btnNo.style.top  = ry + 'px';
    }

    // Jump on hover (desktop)
    btnNo.addEventListener('mouseenter', function(e) {
      jumpAway(e.clientX, e.clientY);
    });

    // Jump on touch start (mobile) — before tap registers
    btnNo.addEventListener('touchstart', function(e) {
      e.preventDefault();
      const t = e.touches[0];
      jumpAway(t.clientX, t.clientY);
    }, { passive: false });

    // If somehow clicked anyway
    btnNo.addEventListener('click', function(e) {
      jumpAway(e.clientX, e.clientY);
    });

    function pressedYes() {
      document.getElementById('celebration').classList.add('show');
      launchConfetti();
      setTimeout(launchConfetti, 400);
    }

    function launchConfetti() {
      const colors = ['#ff69b4','#ff1493','#ffb6c1','#fff','#ffd700','#ff6eb4','#e91e8c'];
      for (let i = 0; i < 60; i++) {
        const c = document.createElement('div');
        c.className = 'confetti-piece';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.left = (20 + Math.random() * 60) + 'vw';
        c.style.top  = (20 + Math.random() * 40) + 'vh';
        const angle = Math.random() * Math.PI * 2;
        const dist  = 80 + Math.random() * 180;
        c.style.setProperty('--cx', Math.cos(angle) * dist + 'px');
        c.style.setProperty('--cy', Math.sin(angle) * dist + 'px');
        c.style.animationDelay = (Math.random() * 0.4) + 's';
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 2200);
      }
    }
  </script>

</body>
</html>
