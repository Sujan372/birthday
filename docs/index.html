<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viji Birthday 💖</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400&family=Dancing+Script:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100vh;
        font-family: "DM Sans", sans-serif;
        overflow-x: hidden;
        display: block;
        background: #1a0510;
      }

      /* Deep romantic background */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 20% 50%,
            rgba(180, 40, 80, 0.18) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse at 80% 20%,
            rgba(120, 20, 60, 0.15) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse at 60% 80%,
            rgba(80, 10, 40, 0.2) 0%,
            transparent 50%
          ),
          linear-gradient(160deg, #1f0a18 0%, #120408 50%, #1a0a0e 100%);
        pointer-events: none;
        z-index: 0;
      }

      /* NAV */
      .top-nav {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 2rem;
        padding: 1.1rem 2rem;
        background: rgba(15, 5, 10, 0.85);
        border-bottom: 1px solid rgba(200, 80, 120, 0.2);
        position: sticky;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 200;
        backdrop-filter: blur(10px);
      }
      .top-nav a {
        font-size: 13px;
        color: #e8a0b8;
        text-decoration: none;
        letter-spacing: 0.08em;
        transition:
          color 0.2s,
          text-shadow 0.2s;
      }
      .top-nav a:hover {
        color: #ffd6e7;
        text-shadow: 0 0 12px rgba(255, 150, 180, 0.6);
      }

      /* MAIN LAYOUT */
      .page-wrap {
        position: relative;
        z-index: 1;
        min-height: calc(100vh - 52px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem 4rem;
        gap: 0;
      }

      /* INTRO TEXT - big, rises from bottom */
      .intro-text {
        font-family: "Dancing Script", cursive;
        font-size: clamp(2.4rem, 8vw, 4.2rem);
        font-weight: 700;
        color: #f0a0c0;
        letter-spacing: 0.03em;
        margin-bottom: 2.8rem;
        text-align: center;
        line-height: 1.2;
        animation: riseUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
        text-shadow:
          0 0 30px rgba(220, 80, 130, 0.6),
          0 0 60px rgba(180, 40, 90, 0.3),
          0 4px 20px rgba(0, 0, 0, 0.4);
      }

      @keyframes riseUp {
        from {
          opacity: 0;
          transform: translateY(70px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeDown {
        from {
          opacity: 0;
          transform: translateY(-14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* CLOSE button above the envelope */
      .close-outside-btn {
        display: none;
        align-items: center;
        gap: 6px;
        margin-bottom: 1rem;
        background: rgba(200, 60, 100, 0.15);
        border: 1px solid rgba(220, 80, 130, 0.35);
        color: #f0a0c0;
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        letter-spacing: 0.06em;
        padding: 6px 18px;
        border-radius: 20px;
        cursor: pointer;
        backdrop-filter: blur(6px);
        transition:
          background 0.2s,
          color 0.2s;
      }
      .close-outside-btn:hover {
        background: rgba(200, 60, 100, 0.28);
        color: #ffd6e7;
      }
      .close-outside-btn.visible {
        display: flex;
      }

      /* ===== ENVELOPE ===== */
      .envelope-container {
        position: relative;
        width: 340px;
        height: 240px;
        animation: floatUp 1s ease 0.5s both;
        cursor: default;
      }

      @keyframes floatUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* gentle float after load */
      .envelope-container.loaded {
        animation:
          floatUp 1s ease 0.5s both,
          gentleFloat 4s ease-in-out 1.5s infinite;
      }
      @keyframes gentleFloat {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      /* envelope body */
      .envelope-body {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          160deg,
          #f5e6ee 0%,
          #f0d5e4 60%,
          #e8c8d8 100%
        );
        border-radius: 6px 6px 10px 10px;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.6),
          0 6px 20px rgba(180, 40, 80, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
      }

      /* diagonal fold lines on body */
      .envelope-body::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            135deg,
            transparent 49.5%,
            rgba(200, 140, 160, 0.25) 49.5%,
            rgba(200, 140, 160, 0.25) 50.5%,
            transparent 50.5%
          ),
          linear-gradient(
            225deg,
            transparent 49.5%,
            rgba(200, 140, 160, 0.25) 49.5%,
            rgba(200, 140, 160, 0.25) 50.5%,
            transparent 50.5%
          );
        border-radius: inherit;
      }

      /* bottom fold */
      .envelope-bottom {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 130px;
        background: linear-gradient(160deg, #f0d8e8 0%, #e8c8d8 100%);
        clip-path: polygon(0 100%, 50% 0%, 100% 100%);
        border-radius: 0 0 10px 10px;
        box-shadow: 0 -2px 8px rgba(180, 80, 120, 0.15);
      }

      /* flap (top triangle) */
      .envelope-flap {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 130px;
        background: linear-gradient(175deg, #fce8f3 0%, #f0d0e6 100%);
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        transform-origin: top center;
        transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 10;
        border-radius: 6px 6px 0 0;
        box-shadow: 0 4px 12px rgba(180, 60, 100, 0.12);
      }
      .envelope-flap.open {
        transform: rotateX(180deg);
      }

      /* LETTER */
      .letter {
        position: absolute;
        top: 10px;
        left: 20px;
        right: 20px;
        background: linear-gradient(160deg, #fff9fc 0%, #fdf0f6 100%);
        border-radius: 6px;
        padding: 1.4rem 1.6rem 1.2rem;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        z-index: 5;
        opacity: 0;
        transition: opacity 0.6s ease 0.5s;
        pointer-events: none;
        text-align: center;
        border: 0.5px solid rgba(220, 150, 180, 0.3);
      }
      .letter.open {
        opacity: 1;
        pointer-events: all;
      }

      /* ruled lines on letter */
      .letter::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          transparent,
          transparent 27px,
          rgba(220, 150, 180, 0.12) 27px,
          rgba(220, 150, 180, 0.12) 28px
        );
        border-radius: inherit;
        pointer-events: none;
      }

      .birthday-heading {
        font-family: "Dancing Script", cursive;
        font-size: 1.25rem;
        font-weight: 700;
        color: #8b1a4a;
        margin-bottom: 0.5rem;
        line-height: 1.3;
        position: relative;
        z-index: 1;
      }

      .letter h2 {
        font-family: "Cormorant Garamond", serif;
        font-size: 0.95rem;
        font-weight: 400;
        color: #7a3050;
        margin-bottom: 0.6rem;
        position: relative;
        z-index: 1;
      }

      .letter p {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: 0.95rem;
        color: #5a2035;
        line-height: 1.7;
        position: relative;
        z-index: 1;
      }

      .letter .signature {
        margin-top: 0.8rem;
        font-family: "Dancing Script", cursive;
        font-size: 1.05rem;
        color: #8b1a4a;
        font-style: normal;
      }

      /* RIBBON */
      .ribbon {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 15;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: opacity 0.4s;
      }
      .ribbon.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .ribbon-band {
        width: 260px;
        height: 12px;
        background: linear-gradient(90deg, #c2185b, #e91e8c, #c2185b);
        border-radius: 2px;
        box-shadow: 0 2px 8px rgba(200, 24, 91, 0.4);
      }
      .ribbon-knot {
        width: 32px;
        height: 32px;
        background: radial-gradient(circle at 40% 40%, #f06292, #c2185b);
        border-radius: 50%;
        margin-top: -10px;
        box-shadow: 0 3px 10px rgba(200, 24, 91, 0.5);
        position: relative;
      }
      .ribbon-knot::before,
      .ribbon-knot::after {
        content: "";
        position: absolute;
        width: 24px;
        height: 16px;
        background: linear-gradient(135deg, #e91e8c, #c2185b);
        border-radius: 50% 50% 0 0;
        top: -10px;
      }
      .ribbon-knot::before {
        left: -14px;
        transform: rotate(-35deg);
      }
      .ribbon-knot::after {
        right: -14px;
        transform: rotate(35deg);
      }

      /* LOTUS SEAL */
      .lotus-seal {
        position: absolute;
        bottom: -20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        cursor: pointer;
        transition:
          transform 0.3s,
          filter 0.3s;
        filter: drop-shadow(0 4px 14px rgba(233, 30, 140, 0.5));
      }
      .lotus-seal:hover {
        transform: translateX(-50%) scale(1.12) rotate(10deg);
        filter: drop-shadow(0 6px 20px rgba(233, 30, 140, 0.7));
      }
      .lotus-seal.hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s;
      }

      /* STAMP */
      .love-stamp {
        position: absolute;
        top: 14px;
        right: 14px;
        font-family: "DM Sans", sans-serif;
        font-size: 9px;
        font-weight: 400;
        letter-spacing: 0.15em;
        color: #c2185b;
        border: 1.5px solid #e91e8c;
        padding: 5px 7px;
        border-radius: 3px;
        background: rgba(252, 228, 236, 0.6);
        z-index: 12;
        transform: rotate(8deg);
      }

      /* HINT */
      .hint {
        position: absolute;
        bottom: -46px;
        left: 50%;
        transform: translateX(-50%);
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: 0.85rem;
        color: rgba(220, 140, 170, 0.7);
        white-space: nowrap;
        letter-spacing: 0.05em;
        animation: pulse 2s ease-in-out infinite;
        transition: opacity 0.4s;
      }
      .hint.hidden {
        opacity: 0;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }

      /* FOOTER */
      .love-footer {
        margin-top: 5rem;
        font-family: "Dancing Script", cursive;
        font-size: 1.2rem;
        color: rgba(220, 140, 170, 0.6);
        text-align: center;
        letter-spacing: 0.05em;
        animation: fadeDown 1s ease 1s both;
        position: relative;
        z-index: 1;
      }

      /* FALLING PETALS */
      .falling-items {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }
      .fall-item {
        position: absolute;
        top: -40px;
        font-size: 1rem;
        opacity: 0;
        animation: fallDown linear infinite;
      }
      @keyframes fallDown {
        0% {
          transform: translateY(0) rotate(0deg) scale(1);
          opacity: 0.8;
        }
        100% {
          transform: translateY(105vh) rotate(400deg) scale(0.6);
          opacity: 0;
        }
      }

      /* SPARKLES on open */
      .sparkle {
        position: fixed;
        pointer-events: none;
        font-size: 1.2rem;
        z-index: 300;
        animation: sparkleOut 1s ease forwards;
      }
      @keyframes sparkleOut {
        0% {
          transform: translate(0, 0) scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(var(--tx), var(--ty)) scale(0);
          opacity: 0;
        }
      }

      @media (max-width: 400px) {
        .envelope-container {
          width: 290px;
          height: 205px;
        }
        .ribbon-band {
          width: 220px;
        }
        .top-nav {
          gap: 1.2rem;
        }
        .top-nav a {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div class="falling-items" id="fallingContainer"></div>

    <nav class="top-nav">
      <a href="surprise.html">💖 Surprise</a>
      <a href="messages.html">💌 Message</a>
      <a href="music.html">🎵 Music</a>
      <a href="gift.html">🌸 Gift</a>
    </nav>

    <div class="page-wrap">
      <div class="intro-text" id="introText">Happy Birthday Viji… 💖</div>

      <button
        class="close-outside-btn"
        id="closeOutsideBtn"
        onclick="closeEnvelope()"
      >
        ✕ &nbsp;Close
      </button>

      <div class="envelope-container" id="envelopeContainer">
        <div class="envelope-body"></div>
        <div class="envelope-bottom"></div>

        <div class="letter" id="letter">
          <h1 class="birthday-heading">Happy Birthday Sweetheart 🌸</h1>
          <h2>🌸 Dear You,</h2>
          <p>
            You are the sunshine<br />of my life.<br />Every day with you<br />is
            my favourite day.
          </p>
          <p class="signature">With all my love,<br />Forever yours 💕</p>
        </div>

        <div class="envelope-flap" id="flap"></div>

        <div class="ribbon" id="ribbon">
          <div class="ribbon-band"></div>
          <div class="ribbon-knot"></div>
        </div>

        <div class="lotus-seal" id="lotusSeal" onclick="openEnvelope()">
          <svg width="58" height="58" viewBox="0 0 100 100">
            <circle
              cx="50"
              cy="50"
              r="44"
              fill="#fce4ec"
              stroke="#e91e8c"
              stroke-width="2"
            />
            <g transform="translate(50,50)">
              <ellipse rx="8" ry="18" fill="#f06292" transform="rotate(0)" />
              <ellipse rx="8" ry="18" fill="#e91e8c" transform="rotate(30)" />
              <ellipse rx="8" ry="18" fill="#f06292" transform="rotate(60)" />
              <ellipse rx="8" ry="18" fill="#e91e8c" transform="rotate(90)" />
              <ellipse rx="8" ry="18" fill="#f06292" transform="rotate(120)" />
              <ellipse rx="8" ry="18" fill="#e91e8c" transform="rotate(150)" />
              <ellipse rx="8" ry="18" fill="#f06292" transform="rotate(180)" />
              <ellipse rx="8" ry="18" fill="#e91e8c" transform="rotate(210)" />
              <ellipse rx="8" ry="18" fill="#f06292" transform="rotate(240)" />
              <ellipse rx="8" ry="18" fill="#e91e8c" transform="rotate(270)" />
              <ellipse rx="8" ry="18" fill="#f06292" transform="rotate(300)" />
              <ellipse rx="8" ry="18" fill="#e91e8c" transform="rotate(330)" />
              <circle r="7" fill="#ad1457" />
            </g>
          </svg>
        </div>

        <div class="love-stamp">💌 LOVE</div>
        <div class="hint" id="hint">click the lotus to open ♡</div>
      </div>

      <footer class="love-footer">You are mine. Always. 💖</footer>
    </div>

    <script>
      // Falling petals
      const symbols = ["🌸", "🌹", "💕", "✨", "🌺", "💖", "🌷", "⭐"];
      const container = document.getElementById("fallingContainer");
      for (let i = 0; i < 22; i++) {
        const el = document.createElement("span");
        el.className = "fall-item";
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left = Math.random() * 100 + "vw";
        el.style.fontSize = 0.6 + Math.random() * 0.9 + "rem";
        el.style.animationDuration = 7 + Math.random() * 10 + "s";
        el.style.animationDelay = Math.random() * 14 + "s";
        container.appendChild(el);
      }

      // Envelope float class after load
      setTimeout(() => {
        document.getElementById("envelopeContainer").classList.add("loaded");
      }, 1600);

      let isOpen = false;

      function openEnvelope() {
        if (isOpen) return;
        isOpen = true;

        document.getElementById("ribbon").classList.add("hidden");
        document.getElementById("lotusSeal").classList.add("hidden");
        document.getElementById("hint").classList.add("hidden");
        document.getElementById("closeOutsideBtn").classList.add("visible");

        document.getElementById("flap").classList.add("open");
        document.getElementById("letter").classList.add("open");

        launchSparkles();
      }

      function closeEnvelope() {
        isOpen = false;
        document.getElementById("letter").classList.remove("open");
        document.getElementById("closeOutsideBtn").classList.remove("visible");
        setTimeout(() => {
          document.getElementById("flap").classList.remove("open");
          document.getElementById("ribbon").classList.remove("hidden");
          document.getElementById("lotusSeal").classList.remove("hidden");
          document.getElementById("hint").classList.remove("hidden");
        }, 400);
      }

      function launchSparkles() {
        const sparks = ["✨", "💖", "🌸", "⭐", "💕", "🌟"];
        for (let i = 0; i < 14; i++) {
          const s = document.createElement("span");
          s.className = "sparkle";
          s.textContent = sparks[Math.floor(Math.random() * sparks.length)];
          const x = 30 + Math.random() * 40; // % across screen
          const y = 30 + Math.random() * 40;
          s.style.left = x + "vw";
          s.style.top = y + "vh";
          const angle = Math.random() * 360;
          const dist = 60 + Math.random() * 80;
          s.style.setProperty("--tx", Math.cos(angle) * dist + "px");
          s.style.setProperty("--ty", Math.sin(angle) * dist + "px");
          s.style.animationDelay = Math.random() * 0.4 + "s";
          document.body.appendChild(s);
          setTimeout(() => s.remove(), 1400);
        }
      }
    </script>
  </body>
</html>
